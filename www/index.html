html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:600 16px/1.25 'Barlow Condensed',system-ui,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:540px;margin:0 auto;background:var(--bg)}
h1,h2,h3,.disp{font-family:'Black Ops One',Impact,sans-serif;font-weight:400;letter-spacing:.4px;margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--good);outline-offset:2px}
.grit{background-image:repeating-linear-gradient(115deg,rgba(255,255,255,.018) 0 1px,transparent 1px 5px),repeating-linear-gradient(25deg,rgba(0,0,0,.25) 0 2px,transparent 2px 9px)}
#hud{padding:max(8px,env(safe-area-inset-top)) 10px 6px;display:grid;gap:6px;background:linear-gradient(#1a1714,#0d0b0a);border-bottom:2px solid var(--rust);box-shadow:0 2px 0 #000}
.row{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:6px;background:#100e0c;border:1px solid #2e2924;box-shadow:inset 0 2px 6px rgba(0,0,0,.7);border-radius:6px;padding:4px 10px;height:36px;white-space:nowrap}
.chip b{font-family:'Black Ops One';font-weight:400;font-size:19px;letter-spacing:.5px}
.chip.pop{animation:pop .25s ease-out}@keyframes pop{50%{transform:scale(1.08);border-color:var(--gold)}}
.coin{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0,#ffb81c 45%,#8a5a06);flex:none;box-shadow:0 0 6px #ffb81c66}
.gemi{width:15px;height:15px;flex:none;background:linear-gradient(135deg,#c8fbff,#5ee8ff 50%,#1f8fb8);clip-path:polygon(50% 0,100% 38%,50% 100%,0 38%)}
#money{color:var(--gold);text-shadow:0 0 8px rgba(255,184,28,.35)}#gems{color:var(--gem)}
.grow{flex:1}
.hbtn{background:#2a2520;border:1px solid #3a332b;border-radius:6px;height:36px;min-width:44px;padding:0 10px;font-family:'Black Ops One';font-size:15px;display:grid;place-items:center}
.hbtn svg{width:18px;height:18px}
#wavebar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
#wlabel{color:var(--ink);font-family:'Black Ops One';font-size:15px;white-space:nowrap;letter-spacing:.5px}
#boss{background:var(--bad);color:#fff;border-radius:3px;padding:1px 6px;font-size:12px;display:none;font-family:'Black Ops One';animation:bp 1s infinite}@keyframes bp{50%{opacity:.55}}
.hpbar{flex:1;height:11px;background:#0a0807;border-radius:2px;overflow:hidden;border:1px solid #3a2a1e}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#6e0808,#e0242c);transition:width .2s;box-shadow:0 0 8px #e0242c88}
#pots{display:flex;gap:4px}
.pot{font-size:12px;border-radius:3px;padding:2px 6px;white-space:nowrap}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0;background:radial-gradient(#15110e,#050404)}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 0 transparent}
#stage.hurt::after{animation:hurt .45s ease-out}@keyframes hurt{0%{box-shadow:inset 0 0 70px 10px rgba(200,0,0,.65)}100%{box-shadow:inset 0 0 0 0 transparent}}
#stage.legend::after{animation:leg .9s ease-out}@keyframes leg{0%{background:rgba(255,220,140,.55)}100%{background:transparent}}
#wrap{position:relative;line-height:0}

#ovl .dr span:first-of-type{overflow:hidden;text-overflow:ellipsis}

#ovl .dr{position:relative;display:flex;justify-content:space-between;gap:6px;margin-top:2px}
#ovl .dr i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
#ovl .dr span{position:relative;white-space:nowrap}
#banner{position:absolute;left:0;right:0;top:41%;display:none;text-align:center;background:rgba(0,0,0,.6);border-block:2px solid #3a3530;padding:10px 0;pointer-events:none;line-height:1.1}
#banner.on{display:grid}
#banner.boss{border-color:#b3121b}
#banner b{font:30px 'Black Ops One';font-weight:400;color:#ece4d6}
#banner.boss b{color:#ff3a3a}
#banner small{font:14px 'Black Ops One';color:#c9bea4;margin-top:4px}
#bgc,#decc{position:absolute;left:0;top:0;pointer-events:none}
#cv{position:relative;display:block;border-radius:4px;touch-action:none;box-shadow:0 0 0 1px #2a221a,0 0 30px #000}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:grid;gap:6px;pointer-events:none;width:92%;justify-items:center}
.t{background:rgba(8,6,5,.92);border:1px solid #4a2a1e;border-left:3px solid var(--bad);padding:7px 14px;border-radius:4px;font-size:15px;animation:tin .25s ease-out;text-align:center;letter-spacing:.3px}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}
#rollp{display:grid;grid-template-columns:80px minmax(0,1fr) 110px;gap:10px;align-items:center;padding:8px 10px;background:linear-gradient(#171412,#100e0c);border-top:2px solid var(--rust)}
#mini{width:80px;height:80px;border-radius:8px;background:radial-gradient(#1c1814,#070605);border:2px solid #2e2924;box-shadow:inset 0 0 16px #000;transition:border-color .2s,box-shadow .2s}

#cname{font-family:'Black Ops One';font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.tags{display:flex;gap:4px;flex-wrap:wrap}

#cstat{font-size:14px;color:var(--dim)}

.cur{outline:2px solid var(--bad)}

#loader{z-index:20;transition:opacity .45s}#loader.out{opacity:0;pointer-events:none}

.mt{font:400 clamp(34px,10vw,48px)/1 'Black Ops One',Impact,sans-serif;color:#ece4d6;letter-spacing:1px;text-shadow:0 3px 0 #000,0 0 24px rgba(224,36,44,.35)}

#lic,#mic{width:min(52vw,230px);height:min(52vw,230px)}
.lbar{width:min(70vw,280px);height:10px;background:#0a0807;border:1px solid #3a2a1e;border-radius:3px;overflow:hidden;margin-top:8px}
.lbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6e0808,#e0242c);box-shadow:0 0 10px #e0242c;transition:width .2s}

#mwel{font:400 20px 'Black Ops One';color:#ece4d6;margin-top:4px}#mwel b{color:#ffb81c;font-weight:400}

.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(86vw,340px);margin-top:12px}

 requestAnimationFrame(frame)}
